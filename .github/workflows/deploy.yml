          # kubectl apply -f kubernetes/secret.yaml -n production
          # kubectl apply -f kubernetes/deployment.yaml -n production
          # kubectl apply -f kubernetes/service.yaml -n production

      - name: Verify Production Health
        run: |
          echo "Verifying rollout status..."
          # kubectl rollout status deployment/agentfx-web -n production --timeout=180s
